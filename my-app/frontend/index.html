<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин одежды</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Магазин одежды</h1>
        <p>Онлайн-покупка одежды с удобным заказом и отслеживанием</p>
    </header>

    <div class="container">
        <div class="section">
            <h2>Каталог товаров</h2>
            <div id="products-container" class="products-grid">

            </div>
            <button id="refresh-products-btn" class="refresh-btn">Обновить товары</button>
        </div>

        <div class="section">
            <h2>Оформление заказа</h2>
            <form id="order-form">
                <div class="form-group">
                    <label for="product-select">Выберите товар:</label>
                    <select id="product-select" required>
                        <option value="">-- Выберите товар --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="customer-name">Ваше имя:</label>
                    <input type="text" id="customer-name" required placeholder="Введите ваше имя">
                </div>
                
                <div class="form-group">
                    <label for="size-select">Размер:</label>
                    <select id="size-select" required>
                        <option value="">-- Выберите размер --</option>
                    </select>
                </div>
                
               <div class="form-group">
                    <label for="quantity">Количество:</label>
                    <div class="quantity-control">
                        <button type="button" id="decrease-quantity">-</button>
                        <input type="number" id="quantity" value="1" min="1" max="10" required>
                        <button type="button" id="increase-quantity">+</button>
                    </div>
                </div>
                
                <button type="submit">Оформить заказ</button>
                <div id="order-message" class="message" style="display: none;"></div>
            </form>
        </div>
    </div>

    <div class="section">
        <h2>Список заказов</h2>
        <table id="orders-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Клиент</th>
                    <th>Товар</th>
                    <th>Размер</th>
                    <th>Кол-во</th>
                    <th>Сумма</th>
                    <th>Статус</th>
                    <th>Дата</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="orders-body">
            </tbody>
        </table>
        <button id="refresh-orders-btn" class="refresh-btn">Обновить заказы</button>
    </div>

    <div class="download-section">
        <h2>Загрузить данные</h2>
        <p>Выберите формат для загрузки данных о товарах или заказах:</p>
        
        <h3>Товары</h3>
        <div class="download-buttons">
            <button onclick="downloadData('products', 'json')" class="download">JSON</button>
            <button onclick="downloadData('products', 'xml')" class="download">XML</button>
            <button onclick="downloadData('products', 'html')" class="download">HTML</button>
        </div>
        
        <h3>Заказы</h3>
        <div class="download-buttons">
            <button onclick="downloadData('orders', 'json')" class="download">JSON</button>
            <button onclick="downloadData('orders', 'xml')" class="download">XML</button>
            <button onclick="downloadData('orders', 'html')" class="download">HTML</button>
        </div>
    </div>

    <footer>
        <p>Магазин одежды</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
